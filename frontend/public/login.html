<div class="screen on" id="s-login">
  <div class="login">
    <div class="login-art">
      <a class="brand" href="/"><svg class="brand-mark" data-logo viewBox="0 0 48 48" aria-hidden="true"></svg><span class="brand-text"><span class="brand-name">VIDA ANIMAL II</span><span class="brand-sub">clínica veterinaria</span></span></a>
      <svg class="pulse" viewBox="0 0 1440 90" preserveAspectRatio="none" aria-hidden="true"><path d="M0 60 H600 l30 -34 l36 58 l32 -76 l30 52 H1440"/></svg>
      <h2>La agenda de la clínica, en un solo lugar</h2>
      <p>Consulta las citas del día, atiende las solicitudes del asistente y mantén los horarios al corriente.</p>
    </div>
    <div class="login-form">
      <form id="login-form" novalidate>
        <a class="back" href="/"><svg class="ic"><use href="#i-left"/></svg>Volver al sitio</a>
        <h1>Inicia sesión</h1>
        <p class="sub">Acceso exclusivo para el personal de Vida Animal II.</p>
        <div class="alert" id="login-err" role="alert"><svg class="ic"><use href="#i-alert"/></svg><span></span></div>
        <div class="field"><label for="lg-user">Usuario</label><input id="lg-user" name="usuario" autocomplete="username" autocapitalize="none" required></div>
        <div class="field"><label for="lg-pass">Contraseña</label><input id="lg-pass" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-purple btn-block" id="lg-btn">Entrar al panel</button>
      </form>
    </div>
  </div>
</div>
