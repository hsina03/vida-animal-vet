name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vida_animal_test
          MYSQL_USER: vida
          MYSQL_PASSWORD: vida_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TZ: America/Ciudad_Juarez
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: vida
      DB_PASSWORD: vida_ci
      DB_NAME_TEST: vida_animal_test
      JWT_SECRET: ci-solo-para-pruebas-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas del chatbot y de la API
        run: npm test
